<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Treasure Road - Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv"></canvas>
      <div class="hud" id="hud" hidden>
        <div class="hud-row">
          <div class="hpc" id="hp0"><div class="who"><span class="nm">REX</span><span class="you" hidden>YOU</span></div><div class="bar"><i></i></div><div class="pips"></div><div class="whud" id="w0"></div></div>
          <div class="hpc r" id="hp1"><div class="who"><span class="nm">ZARA</span><span class="you" hidden>YOU</span></div><div class="bar"><i></i></div><div class="pips"></div><div class="whud" id="w1"></div></div>
        </div>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="toast" id="toast"></div>
      <button class="mute" id="mute" type="button">SOUND: ON</button>
    </div>
  </div>
  <div class="controls" id="controls">
    <div class="pad" id="pad"><i class="knob" id="knob"></i></div>
    <div class="btns">
      <button class="cbtn m" id="bMine" type="button">MINE</button>
      <button class="cbtn g" id="bGren" type="button">BOMB</button>
      <button class="cbtn w" id="bSwitch" type="button">SWAP</button>
      <button class="cbtn b" id="bJump" type="button">JUMP</button>
      <button class="cbtn a" id="bAtk" type="button">USE</button>
    </div>
  </div>
</div>

<div id="result" hidden>
  <div class="rbox" id="rbox">
    <h3 id="rTitle">YOU WIN!</h3>
    <p id="rSub"></p>
    <div class="stats">
      <div><b id="sTime">0</b><span>SEC</span></div>
      <div><b id="sKills">0</b><span>KILLS</span></div>
      <div><b id="sDmg">0</b><span>DAMAGE</span></div>
    </div>
    <div class="rbtns">
      <button class="btn" id="rAgain" type="button">PLAY AGAIN</button>
      <button class="btn alt" id="rMenu" type="button">MENU</button>
    </div>
  </div>
</div>

<script src="Game.js"></script>
</body>
</html>
