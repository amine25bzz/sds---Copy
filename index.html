<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Loading - Treasure Road</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash-screen">
    <h1>TREASURE ROAD</h1>
    <div class="loader"></div>
  </div>
  <audio id="splash-audio" src="sounds/splash.mp3"></audio>
  <script>
    document.body.addEventListener('click', () => {
      const audio = document.getElementById('splash-audio');
      audio.play().catch(e => console.log('Audio play blocked'));
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1200);
    }, { once: true });

    setTimeout(() => {
      window.location.href = 'home.html';
    }, 3500);
  </script>
</body>
</html>
